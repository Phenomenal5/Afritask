# CI (Technical Design "CI runs type checking, contract and permission tests, integration
# checks and build verification"). Runs on every push and pull request. Nothing here
# deploys or touches a real database: the server tests use a throwaway Postgres container.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: afritask
          POSTGRES_PASSWORD: afritask
          # The test guard requires "test" in the database name (tests/setup/testDatabase.js).
          POSTGRES_DB: afritask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afritask -d afritask_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://afritask:afritask@localhost:5432/afritask_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Type-check source and tests
        run: npm run typecheck && npm run typecheck:tests
      # globalSetup applies every migration to the empty database first, which also proves
      # the migration history builds a working schema from scratch.
      - name: Unit + contract
        run: npm run test:unit
      - name: Integration
        run: npm run test:integration
      - name: API
        run: npm run test:api
      - name: End-to-end journeys
        run: npm run test:e2e
      - name: Security (tests + npm audit)
        run: npm run test:security

  client:
    name: Client — types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Production build
        run: npm run build
