<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163C2F" />
    <title>You're offline · Afritask</title>
    <style>
      :root {
        --forest: #163c2f;
        --ivory: #f7f7ef;
        --text: #253c32;
        --muted: #626e63;
        --border: #dfe4d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --forest: #cfe59a;
          --ivory: #101914;
          --text: #e6ede4;
          --muted: #a5b3a8;
          --border: #2c3b33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--ivory);
        color: var(--text);
        font-family: "DM Sans", Arial, sans-serif;
        line-height: 1.55;
      }
      main { max-width: 440px; text-align: center; }
      h1 { font-family: Fraunces, Georgia, serif; font-size: 32px; line-height: 1.15; margin: 20px 0 8px; }
      p { color: var(--muted); margin: 0 0 12px; }
      button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--forest);
        color: var(--ivory);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--forest); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" width="56" height="56" alt="" />
      <h1>You're offline</h1>
      <p>Afritask needs a connection to load your workspace — nothing is stored on this device, so there's nothing out of date to show you.</p>
      <p>Anything you saved before you lost the connection is safe. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
