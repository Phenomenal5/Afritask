# The database is on Neon (DATABASE_URL / DIRECT_DATABASE_URL in .env), so there's no
# Postgres container here.
# Local dev:   `docker compose up -d redis` then `npm run dev` on the host.
# Full stack:  `docker compose up -d --build` (server + Redis, database on Neon).
# Migrations:  `npm run db:deploy` from the host. The server image doesn't include the
#              Prisma CLI, so it can't run them itself (docs/RELEASE.md).
services:
  server:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Inside compose, reach the Redis container by service name, not localhost.
      REDIS_URL: redis://redis:6379
      # Overrides a PORT from .env so it matches the 3000:3000 mapping above.
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
